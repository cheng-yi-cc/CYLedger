name: Market data regression
on:
  push:
    branches: [main, fix/market-data-routing]
    paths:
      - 'pkg/marketquotes/**'
      - 'pkg/marketrelay/**'
      - 'tools/market-relay/**'
      - 'android/**'
      - 'scripts/build_android.py'
      - 'scripts/test_market_network_config.py'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/marketquotes-test.yml'
  pull_request:
    paths:
      - 'pkg/marketquotes/**'
      - 'pkg/marketrelay/**'
      - 'tools/market-relay/**'
      - 'android/**'
      - 'scripts/build_android.py'
      - 'scripts/test_market_network_config.py'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/marketquotes-test.yml'
permissions:
  contents: read
concurrency:
  group: marketquotes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Market data regression
        env:
          GOFLAGS: -mod=readonly
        run: |
          go test -race -count=1 -timeout=5m ./pkg/marketquotes ./pkg/marketrelay ./android/backend
          go build -o /tmp/cyledger-market-relay ./tools/market-relay
          python3 scripts/test_market_network_config.py
