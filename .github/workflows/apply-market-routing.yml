# Temporary, branch-only application of the reviewed source patch. Remove after use.
name: Apply and validate market routing
on:
  push:
    branches: [fix/market-data-routing]
    paths:
      - '.github/market-routing/**'
      - '.github/workflows/apply-market-routing.yml'
permissions:
  contents: read
concurrency:
  group: apply-market-routing
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'cheng-yi-cc/CYLedger' && github.ref == 'refs/heads/fix/market-data-routing'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply reviewed patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          parts = pathlib.Path('.github/market-routing')
          encoded = b''.join((parts / f'{i:02}').read_bytes() for i in range(4))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True), memlimit=134217728)
          assert hashlib.sha256(patch).hexdigest() == '4bcc97ee0fc2fe28295a380f5b256cef79164f9c724fedcb4c66e0ef971925ff'
          target = pathlib.Path('/tmp/market-routing.patch')
          target.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', str(target)], check=True)
          PY
          git rm pkg/marketquotes/fund_dns.go pkg/marketquotes/fund_dns_test.go
          git diff --check
          git diff --stat
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve checksum for already-pinned singleflight dependency
        run: go mod download golang.org/x/sync
      - name: Go race regression and relay build
        env:
          GOFLAGS: -mod=readonly
        run: |
          go test -race -count=1 -timeout=5m -json ./pkg/marketquotes ./pkg/marketrelay ./android/backend | tee /tmp/market-tests.jsonl
          go build -o /tmp/cyledger-market-relay ./tools/market-relay
      - name: Android configuration and Java compilation
        run: |
          python3 scripts/test_market_network_config.py
          platform=$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)
          test -n "$platform"
          mkdir -p /tmp/market-java
          javac -source 8 -target 8 -encoding UTF-8 -classpath "$platform" -d /tmp/market-java $(find android/app/src/main/java -name '*.java')
      - name: Android ARM64 native and JNI compilation
        env:
          GOFLAGS: -mod=readonly
        run: |
          ndk=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          compiler="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          test -x "$compiler"
          mkdir -p /tmp/market-native
          GOOS=android GOARCH=arm64 CGO_ENABLED=1 CC="$compiler" go build -trimpath -buildmode=c-shared -o /tmp/market-native/libcyledger_backend.so ./android/backend
          "$compiler" -shared -fPIC -O2 -Wl,-z,max-page-size=16384 -I /tmp/market-native android/native/jni.c -L /tmp/market-native -lcyledger_backend -o /tmp/market-native/libcyledger_jni.so
      - name: Commit validated source on feature branch only
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rm .github/market-routing/00 .github/market-routing/01 .github/market-routing/02 .github/market-routing/03
          git add android pkg scripts docs deploy tools go.sum
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'refactor: isolate domestic and overseas market routes with bounded concurrent refresh'
          git push origin HEAD:refs/heads/fix/market-data-routing
          git archive --format=tar.gz -o /tmp/cyledger-validated-source.tar.gz HEAD
      - name: Export test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-routing-test-evidence
          path: |
            /tmp/market-tests.jsonl
            /tmp/cyledger-validated-source.tar.gz
          if-no-files-found: ignore
          retention-days: 7
