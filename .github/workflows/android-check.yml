name: OpenBill Android frontend
on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'package*.json', 'vite.config.ts', '.github/workflows/android-check.yml']
  pull_request:
    paths: ['src/**', 'public/**', 'package*.json', 'vite.config.ts', '.github/workflows/android-check.yml']
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node node_modules/vue-tsc/bin/vue-tsc.js --noEmit
      - run: npm test
      - run: npm run build
      - name: Check Android-only assets
        run: test -f dist/mobile.html && test ! -f dist/desktop.html
