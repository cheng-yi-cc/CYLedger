<!DOCTYPE html>
<html data-dir-mode="static">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f6f6f8">
    <meta name="format-detection" content="telephone=no"/>
    <meta name="description" content="OpenBill：Android 本地记账与资产管理。">
    <title>OpenBill</title>
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <link id="framework7-css" rel="stylesheet" crossorigin>
    <script>
        if (location.search.includes('rtl')) {
            document.querySelector('html').setAttribute('dir', 'rtl');
            document.getElementById('framework7-css').href = '{{framework7-rtl-css-filepath}}';
        } else {
            document.querySelector('html').removeAttribute('dir');
            document.getElementById('framework7-css').href = '{{framework7-ltr-css-filepath}}';
        }
    </script>
    <script src="./server_settings.js"></script>
</head>
<body>
    <noscript>
        <strong>OpenBill 需要启用 JavaScript 才能打开账本。</strong>
    </noscript>
    <div id="app"></div>

    <script type="module" src="./mobile-main.ts"></script>
</body>
</html>
